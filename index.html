<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScoreLab</title>
<style>
:root{--bg:#f2f5f9;--card:#fff;--hd:#e3e9f2;--tx:#0b1220;--mu:#6b778c;--ac:#14a362;--ln:#d5dce8;--live:#e5484d;--gold:#e0a800;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1020;--card:#141c2e;--hd:#1f2a41;--tx:#f1f5fb;--mu:#8d9ab3;--ac:#2fe08f;--ln:#27324a;--gold:#f2c230}}
:root[data-theme="dark"]{--bg:#0a1020;--card:#141c2e;--hd:#1f2a41;--tx:#f1f5fb;--mu:#8d9ab3;--ac:#2fe08f;--ln:#27324a;--gold:#f2c230}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
header{padding:10px 12px 0;display:flex;gap:8px;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:22px;background:var(--card);padding:8px 16px;border-radius:22px}.logo b{color:var(--ac)}
.pill{display:flex;gap:6px;align-items:center;background:var(--card);padding:6px 8px;border-radius:22px}
.live{border:2px solid var(--live);color:var(--live);background:none;border-radius:16px;padding:4px 10px;font-weight:700;font-size:13px;cursor:pointer}
.live.on{background:var(--live);color:#fff}
button.ic{background:none;border:0;color:var(--tx);padding:4px;cursor:pointer;display:flex}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#search{display:none;margin:8px 12px 0}#search input{width:100%;padding:10px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:15px}
#days{display:flex;gap:4px;overflow-x:auto;padding:12px;scrollbar-width:none;border-bottom:1px solid var(--ln)}
.day{flex:0 0 auto;text-align:center;padding:7px 11px;border-radius:14px;border:2px solid transparent;color:var(--mu);font-size:13px;cursor:pointer;line-height:1.35}
.day.on{border-color:var(--ac);color:var(--ac);font-weight:700}
main{flex:1;overflow-y:auto;padding:12px 12px 100px}
.grp{background:var(--card);border-radius:18px;margin-bottom:12px;overflow:hidden;border-left:4px solid #6c5ce7}
.grp.fav{border-color:var(--ac)}
.gh{display:flex;align-items:center;gap:8px;padding:12px;background:var(--hd);font-weight:700;cursor:pointer}
.gh .n{margin-left:auto;color:var(--mu);font-weight:500}.gh.fav{color:var(--ac);font-size:17px}
.chev{transition:.2s;width:18px}.col .chev{transform:rotate(-90deg)}
.m{display:flex;align-items:center;padding:10px 12px;gap:10px;border-top:1px solid var(--ln);cursor:pointer}
.m:first-of-type{border-top:0}
.t{width:50px;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}.t.lv{color:var(--live)}
.tm{flex:1;border-left:1px solid var(--mu);padding-left:10px;display:flex;flex-direction:column;gap:6px}
.tr{display:flex;align-items:center;gap:8px;font-weight:600}.tr span.s{margin-left:auto;font-weight:800;padding-right:6px}
.b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff;flex:none}
.act{display:flex;gap:4px;border-left:1px solid var(--mu);padding-left:8px}
.act .ic.on{color:var(--gold)}.act .ic.on svg{fill:var(--gold)}
.empty{text-align:center;color:var(--mu);padding:50px 20px}
nav{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;background:var(--card);border:1px solid var(--ln);border-radius:30px;padding:6px;box-shadow:0 6px 24px #0005}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:7px 0;border-radius:24px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button.on{background:var(--hd);color:var(--ac)}
#sheet{position:absolute;inset:0;background:var(--bg);transform:translateY(100%);transition:.3s;z-index:5;overflow-y:auto;padding:12px}
#sheet.open{transform:none}
.hero{display:flex;justify-content:space-around;align-items:center;text-align:center;padding:20px 0;font-weight:700}
.hero .b{width:56px;height:56px;font-size:16px;margin:0 auto 8px}.hero .sc{font-size:34px;font-weight:800}
.tabs{display:flex;gap:6px;margin:6px 0 14px}.tabs button{flex:1;padding:9px;border-radius:12px;border:0;background:var(--card);color:var(--mu);font-weight:700;cursor:pointer}.tabs .on{background:var(--ac);color:#04140c}
.bar{margin:12px 0}.bar .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.bar .tr2{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--hd);gap:2px}.bar .tr2 i{display:block;background:var(--ac)}.bar .tr2 i+i{background:#6c5ce7}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
h3{margin:4px 0 10px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 4px;text-align:center}td:nth-child(2),th:nth-child(2){text-align:left}tr+tr{border-top:1px solid var(--ln)}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--ln)}.row:first-child{border:0}
.chip{padding:5px 10px;border-radius:10px;background:var(--hd);font-weight:700;font-size:12px}.chip.hi{background:var(--ac);color:#04140c}
.dh{position:sticky;top:-12px;z-index:3;margin:-12px -12px 0;padding:12px 12px 10px;background:linear-gradient(90deg,#1c5c3f,var(--bg) 50%,#5e1d30);display:flex;align-items:center;justify-content:space-between;gap:6px}
.dh .rd{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;border:0;color:var(--tx);cursor:pointer}
.dh .b{width:50px;height:50px;font-size:13px}.vs{text-align:center;font-weight:800;font-variant-numeric:tabular-nums}.vs i{display:inline-block;border:2px solid var(--tx);border-radius:8px;padding:2px 10px;font-style:normal;font-size:18px}.vs small{display:block;color:var(--mu);margin-top:6px;font-size:14px}
.pl{display:flex;background:var(--card);border-radius:24px;padding:8px 10px;gap:6px}.pl .on{color:var(--gold)}.pl .on svg{fill:var(--gold)}.pl .lv2{color:var(--ac)}
.tb2{position:sticky;top:60px;z-index:3;margin:0 -12px 12px;display:flex;overflow-x:auto;background:var(--hd);scrollbar-width:none;align-items:center}
.tb2 button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--tx);padding:14px 14px;font-size:15px;font-weight:600;cursor:pointer}.tb2 button.on{color:var(--ac);border-color:var(--ac);font-weight:800}
.tn{display:flex;align-items:center;gap:8px;font-weight:800;margin:12px 0 8px}.tn .b{width:26px;height:26px}
.ins{background:var(--hd);border-radius:12px;padding:13px 14px;margin-bottom:8px;border-left:4px solid var(--ac)}.ins.a{border-color:#d96a82}
.more{display:block;text-align:center;color:#8c7bff;font-weight:700;padding:12px;cursor:pointer;background:none;border:0;width:100%;font-size:15px}
.ai{border:2px solid #6c5ce7;border-radius:20px;padding:14px;margin-bottom:12px;background:var(--card)}.ai .ah{display:flex;align-items:center;gap:10px}.ai .ao{width:44px;height:44px;border-radius:12px;background:#7a5cf0;display:grid;place-items:center;color:#fff}
.ai .gp{margin-left:auto;border:1px solid #6c5ce7;border-radius:16px;padding:5px 12px;color:#8c7bff;font-weight:700;font-size:13px}
.ai .tx{color:var(--mu);line-height:1.6;margin:14px 0;overflow:hidden;max-height:130px;position:relative}.ai .tx.op{max-height:900px}.ai .tx:not(.op):after{content:"";position:absolute;inset:60% 0 0;background:linear-gradient(transparent,var(--card))}
.ai .rb{width:100%;padding:13px;border-radius:12px;border:1px solid #6c5ce7;background:#6c5ce722;color:#8c7bff;font-weight:700;font-size:16px;cursor:pointer}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sg div{background:var(--bg);border-radius:12px;padding:12px;display:flex;justify-content:space-between;font-size:12px;font-weight:700;gap:6px}.sg b{font-size:16px;color:#2aa9c9}
.sh{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;cursor:pointer}.sh svg{color:var(--ac)}.sh .e{margin-left:auto}
.od{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.od div{background:var(--hd);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mu)}.od b{display:block;font-size:19px;color:var(--tx)}.od .v{outline:2px solid var(--ac)}
tr.me{background:var(--hd);font-weight:800}
button.chip{border:0;color:var(--tx);cursor:pointer;white-space:nowrap}button.chip.hi{color:#04140c}
.dh.hb{display:block;position:static;text-align:center;padding-bottom:14px}.hr1{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.hr1 a{color:#a99bff;font-weight:700;cursor:pointer}.hv{color:var(--mu);font-size:13px}
.hr2{display:flex;align-items:center;justify-content:space-around;margin:10px 0 4px}.hr2 .b{width:86px;height:86px;font-size:22px}.vs2 small{display:block;color:var(--mu);margin:4px 0}.vs2 i{display:inline-block;border:2px solid var(--tx);border-radius:10px;padding:6px 14px;font-style:normal;font-weight:800;font-size:20px}
.hr3{display:flex;justify-content:space-around;font-size:19px;font-weight:800}.hr2 .on{color:var(--gold)}.hr2 .on svg{fill:var(--gold)}.tb2.t0{top:0}
.fc,.fc3{display:inline-grid;place-items:center;font-weight:800;border-radius:9px}.fc{width:34px;height:40px;font-size:15px;margin:0 2px}.fc.W{background:#2fa86b44;color:#4fd08a}.fc.D{background:#8d9ab344;color:var(--mu)}.fc.L{background:#e5484d44;color:#ff6b72}
.fc3{width:28px;height:30px;font-size:13px;margin:0 2px;color:#fff}.fc3.W{background:#2fa86b}.fc3.D{background:#7b869c}.fc3.L{background:#e5484d}
.mf{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:2px}.mf.W{background:#2fa86b}.mf.D{background:#7b869c}.mf.L{background:#e5484d}
.fr{display:flex}.fg{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin:8px 0}.fg .pill2{background:var(--hd);padding:8px 10px;border-radius:12px;font-weight:700;font-size:13px;white-space:nowrap}.big{font-size:34px;font-weight:800;line-height:1.1}
.od3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;text-align:center}
.mv{display:grid;grid-template-columns:62px 40px 1fr 46px 62px;gap:6px;align-items:center;margin:10px 0;font-size:12px}.mv svg{width:100%;height:36px}.mv b{font-size:16px}.mv em{font-style:normal;font-weight:700}
.hm{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;margin:8px 0;font-size:13px}.hm b{color:var(--ac);text-align:right}
.od2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.od2>div{background:var(--bg);border-radius:12px;padding:10px;font-size:13px}.od2 p{display:flex;justify-content:space-between;margin:6px 0 0;color:var(--mu)}.od2 em{font-style:normal;color:var(--tx);font-weight:700}
.tt{font-size:12.5px}.tt .tl{display:inline-flex;align-items:center;gap:6px}.tt img{width:20px;height:20px;object-fit:contain}
.pitch{position:relative;border:2px solid #34425f;border-radius:14px;aspect-ratio:1/2.1;margin:8px 0;background:var(--card)}.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #34425f}.pitch:after{content:"";position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border:2px solid #34425f;border-radius:50%;transform:translate(-50%,-50%)}
.pp{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:11.5px;z-index:1;width:70px}.pp .av{width:46px;height:46px;border-radius:50%;border:3px solid;margin:0 auto 2px;background:var(--hd) center/cover;display:grid;place-items:center;font-weight:800}.pp small{display:block;color:var(--mu)}
.warn{border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:12px;margin-bottom:12px}.tb3{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.dr{display:grid;grid-template-columns:1fr 62px 62px 62px;align-items:center;padding:9px 0;font-size:14px;text-align:center}.dr span:first-child{text-align:left}.dr b{font-weight:600;border-radius:8px;padding:6px 0}.dr b.hl{background:#2fa86b30;color:var(--ac)}
.cr{display:grid;grid-template-columns:52px 1fr 52px;align-items:end;gap:6px;margin:12px 0;font-size:16px}.cr .m1{text-align:center;font-size:13px;margin-bottom:4px}.cr b{font-weight:600}.cr .gc{color:var(--ac);font-weight:800}.cr .bc{color:#5b8cff;font-weight:800}
.stp{display:flex;gap:14px;align-items:center;justify-content:space-around;margin-top:12px;text-align:center}.stp b{margin:0 8px;font-size:20px}
.cs2{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:12px}.cs2>div{background:var(--card);border-radius:18px;padding:14px;text-align:center;font-weight:800;font-size:17px}.cs2 .b{width:44px;height:44px;margin:0 auto 6px}.cs2 small{display:block;background:var(--bg);border-radius:12px;padding:8px;margin-top:8px;color:#a99bff;font-size:12px}.cs2 button{width:48px;height:48px;border-radius:50%;border:0;background:#4635a0;color:#fff;cursor:pointer}
</style></head><body>
<div id="app">
<header><div class="logo">Score<b>Lab</b></div>
<div class="pill"><button class="live" id="liveBtn"></button><button class="ic" id="sBtn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button></div></header>
<div id="search"><input id="q" placeholder="Takım veya lig ara…"></div>
<div id="days"></div>
<main id="main"></main>
<nav id="nav"></nav>
<div id="sheet"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const IC={star:'<svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',bell:'<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg>',chev:'<svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>'};
const LEAGUES={
 sl:{n:'Türkiye - Süper Lig',f:'🇹🇷',t:['Galatasaray','Fenerbahçe','Beşiktaş','Trabzonspor','Konyaspor','Başakşehir','Samsunspor','Rizespor']},
 ll:{n:'İspanya - LaLiga',f:'🇪🇸',t:['Real Madrid','Barcelona','Atlético','Villarreal','Espanyol','Sevilla','Betis','Girona']},
 bl:{n:'Almanya - Bundesliga',f:'🇩🇪',t:['Bayern','Dortmund','Leipzig','Leverkusen','Mainz 05','Elversberg','Stuttgart','Frankfurt']},
 l1:{n:'Fransa - Ligue 1',f:'🇫🇷',t:['PSG','Marseille','Lyon','Nice','Rennes','Lille','Lens','Le Havre']},
 pl:{n:'İngiltere - Premier Lig',f:'🏴',t:['Arsenal','Liverpool','Man City','Chelsea','Tottenham','Newcastle','Aston Villa','Everton']},
 sa:{n:'İtalya - Serie A',f:'🇮🇹',t:['Inter','Milan','Juventus','Napoli','Roma','Lazio','Atalanta','Fiorentina']},
 l2:{n:'Türkiye - 1. Lig',f:'🇹🇷',t:['Erokspor','Keçiörengücü','Bodrum','Sivasspor','Çorum','Ümraniye']},
 br:{n:'Brezilya - Serie A',f:'🇧🇷',t:['Flamengo','Palmeiras','Santos','Corinthians','Grêmio','Botafogo']}};
const TODAY=[['sl','Konyaspor','Galatasaray','20:00'],['ll','Villarreal','Espanyol','23:00'],['bl','Elversberg','Mainz 05','22:30'],['l1','Nice','Rennes','21:00'],['l1','Le Havre','PSG','21:00'],['l1','Lille','Lens','23:05'],['l2','Erokspor','Keçiörengücü','20:00'],['br','Flamengo','Palmeiras','L67',1,1],['br','Santos','Corinthians','L34',0,2],['br','Grêmio','Botafogo','L81',2,1],['pl','Arsenal','Everton','L12',0,0]];
const base=new Date(2026,9,30),DN=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
let S={day:0,fav:{},bell:{'sl0':1},col:{},liveOnly:false,tab:'m',q:'',theme:'auto'};
try{Object.assign(S,JSON.parse(localStorage.getItem('sl')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('sl',JSON.stringify({fav:S.fav,bell:S.bell,theme:S.theme,tfav:S.tfav,poll:S.poll}))}catch(e){}};
function rnd(seed){let x=seed*9301+49297;return()=>((x=(x*9301+49297)%233280)/233280)}
function dayMatches(d){
 const out=[];
 if(d===0){TODAY.forEach((m,i)=>out.push({id:'0-'+i,lg:m[0],h:m[1],a:m[2],time:m[3][0]=='L'?null:m[3],min:m[3][0]=='L'?+m[3].slice(1):null,hs:m[4],as:m[5]}));return out}
 const r=rnd(d+77),ks=Object.keys(LEAGUES);
 ks.forEach(k=>{if(r()<.65){const t=LEAGUES[k].t.slice(),n=1+Math.floor(r()*2);for(let j=0;j<n;j++){const h=t.splice(Math.floor(r()*t.length),1)[0],a=t.splice(Math.floor(r()*t.length),1)[0];
  const past=d<0,hs=Math.floor(r()*4),as=Math.floor(r()*3);
  out.push({id:d+'-'+k+j,lg:k,h,a,time:String(17+Math.floor(r()*6))+':'+['00','30','45','15'][Math.floor(r()*4)],fin:past,hs:past?hs:null,as:past?as:null})}}});
 return out}
function badge(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return`<div class="b" style="background:hsl(${h} 55% 42%)">${n.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü0-9]/g,'').slice(0,3).toUpperCase()}</div>`}
const fmt=d=>{const x=new Date(base);x.setDate(x.getDate()+d);return x};
function renderDays(){$('#days').innerHTML=[-3,-2,-1,0,1,2,3].map(d=>{const x=fmt(d);return`<div class="day ${d===S.day?'on':''}" data-d="${d}">${d?DN[x.getDay()]:'Bugün'}<br>${String(x.getDate()).padStart(2,'0')}.${String(x.getMonth()+1).padStart(2,'0')}</div>`}).join('');
 const o=$('.day.on');o&&o.scrollIntoView({inline:'center',block:'nearest'})}
function mrow(m){const lv=m.min!=null,sc=lv||m.fin;
 return`<div class="m" data-id="${m.id}"><div class="t ${lv?'lv':''}">${lv?m.min+'’':m.fin?'MS':m.time}</div>
 <div class="tm"><div class="tr">${badge(m.h)}${m.h}${sc?`<span class="s">${m.hs}</span>`:''}</div><div class="tr">${badge(m.a)}${m.a}${sc?`<span class="s">${m.as}</span>`:''}</div></div>
 <div class="act"><button class="ic ${S.bell[m.id]?'on':''}" data-bell="${m.id}">${IC.bell}</button><button class="ic ${S.fav[m.id]?'on':''}" data-fav="${m.id}">${IC.star}</button></div></div>`}
function renderMatches(){
 const ms=dayMatches(S.day);const q=S.q.toLowerCase();
 const all=ms.filter(m=>(!S.liveOnly||m.min!=null)&&(!q||(m.h+m.a+LEAGUES[m.lg].n).toLowerCase().includes(q)));
 const lc=dayMatches(0).filter(m=>m.min!=null).length;
 $('#liveBtn').className='live'+(S.liveOnly?' on':'');$('#liveBtn').textContent='● CANLI '+lc;
 const favs=ms.filter(m=>S.fav[m.id]);let h='';
 const grp=(key,title,cls,list)=>`<div class="grp ${cls} ${S.col[key]?'col':''}"><div class="gh ${cls}" data-g="${key}">${IC.chev}${title}<span class="n">${list.length}</span></div>${S.col[key]?'':list.map(mrow).join('')}</div>`;
 if(favs.length)h+=grp('fav','★ Maçlarım','fav',favs);
 Object.keys(LEAGUES).forEach(k=>{const l=all.filter(m=>m.lg===k);if(l.length)h+=grp(k,LEAGUES[k].f+' '+LEAGUES[k].n,'',l)});
 $('#main').innerHTML=h||'<div class="empty">Bu gün için maç bulunamadı.</div>'}
function bars(m){const r=rnd(m.id.length*13+m.h.length*7+m.a.length);const hp=40+Math.floor(r()*25);
 const rows=[['Topla oynama',hp,100-hp,'%'],['Toplam şut',6+Math.floor(r()*9),4+Math.floor(r()*8)],['İsabetli şut',2+Math.floor(r()*5),1+Math.floor(r()*4)],['Korner',2+Math.floor(r()*6),1+Math.floor(r()*6)],['Faul',8+Math.floor(r()*8),8+Math.floor(r()*8)],['Sarı kart',Math.floor(r()*4),Math.floor(r()*4)]];
